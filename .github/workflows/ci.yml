name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-packaging.txt
      - name: Run tests
        # Retry once: PySide6 offscreen teardown can segfault after all
        # tests pass (exit 139) — a known flake, not a real failure.
        run: QT_QPA_PLATFORM=offscreen python -m pytest tests -q || QT_QPA_PLATFORM=offscreen python -m pytest tests -q
      - name: B61 fetch-race stress (no retry)
        # Deliberately NOT wrapped in the retry above — a retry would mask
        # the real Settings-window segfault regression this test guards.
        run: QT_QPA_PLATFORM=offscreen python -m pytest tests/ui/test_settings_fetch_race.py -q

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-packaging.txt
      - name: Run tests
        # Retry once: Qt offscreen teardown flake (same as the Linux job).
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pytest tests -q
          if ($LASTEXITCODE -ne 0) { python -m pytest tests -q }
        shell: pwsh
      - name: B61 fetch-race stress (no retry)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pytest tests/ui/test_settings_fetch_race.py -q
        shell: pwsh
