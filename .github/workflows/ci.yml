name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-packaging.txt
      - name: Lint
        run: |
          pip install ruff
          ruff check --select F,E9 --exclude vendor --exclude tests .
      - name: Run tests
        # Retry once, but ONLY on segfault (exit 139): PySide6 offscreen
        # teardown can crash after all tests pass — a known flake. Any
        # other exit code fails immediately; a blanket retry would mask
        # real regressions (B79).
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen python -m pytest tests -q
          code=$?
          if [ "$code" -eq 139 ]; then
            echo "Segfault (139) — retrying once (flake-retried)"
            QT_QPA_PLATFORM=offscreen python -m pytest tests -q
            code=$?
          fi
          exit $code
      - name: B61 fetch-race stress (no retry)
        # Deliberately NOT wrapped in the retry above — a retry would mask
        # the real Settings-window segfault regression this test guards.
        run: QT_QPA_PLATFORM=offscreen python -m pytest tests/ui/test_settings_fetch_race.py -q

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-packaging.txt
      - name: Lint
        run: |
          pip install ruff
          ruff check --select F,E9 --exclude vendor --exclude tests .
      - name: Run tests
        # Retry once on access-violation/segfault only (0xC0000005 =
        # -1073741819); any other failure fails immediately (B79).
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pytest tests -q
          if ($LASTEXITCODE -eq -1073741819 -or $LASTEXITCODE -eq 3221225477) {
            Write-Host "Segfault — retrying once (flake-retried)"
            python -m pytest tests -q
          }
        shell: pwsh
      - name: B61 fetch-race stress (no retry)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pytest tests/ui/test_settings_fetch_race.py -q
        shell: pwsh
