name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-packaging.txt
      - name: Run tests
        # Retry once: PySide6 offscreen teardown can segfault after all
        # tests pass (exit 139) — a known flake, not a real failure.
        run: QT_QPA_PLATFORM=offscreen python -m pytest tests -q || QT_QPA_PLATFORM=offscreen python -m pytest tests -q

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-packaging.txt
      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
      - name: Install nfpm
        run: |
          curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.43.1/nfpm_2.43.1_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin nfpm
      - name: Build
        run: bash packaging/build_linux.sh
      - name: Smoke test
        run: |
          test -x dist/NexaDesk/NexaDesk
          env -u APP_VERSION dist/NexaDesk/NexaDesk --version | grep -Fx "$APP_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.tar.gz

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-packaging.txt
      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
      - name: Build
        shell: bash
        run: |
          printf '%s' "$APP_VERSION" > _version.txt
          pyinstaller packaging/nexadesk.spec --noconfirm --distpath dist --workpath build
      - name: Smoke test
        shell: bash
        run: |
          test -f dist/NexaDesk/NexaDesk.exe
          # B31: port of the linux build's OCR presence guard.
          test -d dist/NexaDesk/_internal/rapidocr_onnxruntime
          test -d dist/NexaDesk/_internal/onnxruntime
          env -u APP_VERSION dist/NexaDesk/NexaDesk.exe --version | grep -Fx "$APP_VERSION"
      - name: Package zip
        shell: pwsh
        run: |
          Copy-Item NOTICE dist/NexaDesk/NOTICE
          Compress-Archive -Path dist/NexaDesk -DestinationPath "dist/NexaDesk_${env:APP_VERSION}_windows_x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip

  release:
    needs: [build-linux, build-windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
